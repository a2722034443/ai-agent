server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: local-life-agent
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/local_life_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:agent}
    password: ${DB_PASSWORD:agentpass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  session-ttl-hours: 24
  mock-session-store: false
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
  allow-mock-poi: ${ALLOW_MOCK_POI:false}

external:
  amap:
    enabled: ${AMAP_ENABLED:true}
    base-url: ${AMAP_BASE_URL:https://restapi.amap.com}
    web-service-key: ${AMAP_WEB_SERVICE_KEY:}
    js-api-key: ${AMAP_JS_API_KEY:}
    js-security-code: ${AMAP_JS_SECURITY_CODE:}
    city: ${AMAP_CITY:}
    default-origin: ${AMAP_DEFAULT_ORIGIN:}
    timeout-ms: ${AMAP_TIMEOUT_MS:3000}
  search:
    enabled: ${SEARCH_ENABLED:true}
    provider: ${SEARCH_PROVIDER:tavily}
    base-url: ${TAVILY_BASE_URL:https://api.tavily.com}
    tavily-api-key: ${TAVILY_API_KEY:}
    max-results: ${SEARCH_MAX_RESULTS:5}
    timeout-ms: ${SEARCH_TIMEOUT_MS:3000}
  llm:
    enabled: ${MIMO_ENABLED:true}
    provider: ${LLM_PROVIDER:mimo}
    api-key: ${MIMO_API_KEY:}
    base-url: ${MIMO_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
    model: ${MIMO_MODEL:mimo-v2.5-pro}
    max-tokens: ${MIMO_MAX_TOKENS:1024}
    temperature: ${MIMO_TEMPERATURE:0.1}
    timeout-ms: ${MIMO_TIMEOUT_MS:4000}
    router-mode: ${MIMO_ROUTER_MODE:primary-fallback}
    secondary:
      enabled: ${MIMO_SECONDARY_ENABLED:true}
      api-key: ${MIMO_SECONDARY_API_KEY:}
      base-url: ${MIMO_SECONDARY_BASE_URL:}
      model: ${MIMO_SECONDARY_MODEL:}
      max-tokens: ${MIMO_SECONDARY_MAX_TOKENS:1024}
      timeout-ms: ${MIMO_SECONDARY_TIMEOUT_MS:4000}
  asr:
    enabled: ${ASR_ENABLED:true}
    provider: ${ASR_PROVIDER:mock}
    mock-provider: ${ASR_MOCK_PROVIDER:mock}
    aliyun-provider: ${ASR_ALIYUN_PROVIDER:aliyun}
    base-url: ${ASR_BASE_URL:https://nls-gateway-cn-shanghai.aliyuncs.com}
    token-url: ${ASR_TOKEN_URL:https://nls-meta.cn-shanghai.aliyuncs.com}
    token-action: ${ASR_TOKEN_ACTION:CreateToken}
    token-version: "${ASR_TOKEN_VERSION:2019-02-28}"
    token-timestamp-pattern: "${ASR_TOKEN_TIMESTAMP_PATTERN:yyyy-MM-dd'T'HH:mm:ss'Z'}"
    success-status: "${ASR_SUCCESS_STATUS:20000000}"
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    app-key: ${ALIYUN_NLS_APP_KEY:}
    format: ${ASR_AUDIO_FORMAT:wav}
    sample-rate: ${ASR_SAMPLE_RATE:16000}
    timeout-ms: ${ASR_TIMEOUT_MS:15000}
    max-audio-mb: ${ASR_MAX_AUDIO_MB:10}
    max-duration-seconds: ${ASR_MAX_DURATION_SECONDS:30}
    # Realtime ASR WebSocket controls.
    stream:
      enabled: ${ASR_STREAM_ENABLED:true}
      url: ${ASR_STREAM_URL:wss://nls-gateway-cn-shanghai.aliyuncs.com/ws/v1}
      chunk-millis: ${ASR_STREAM_CHUNK_MILLIS:200}
      chunk-chars: ${ASR_STREAM_CHUNK_CHARS:15}
      silence-fallback-ms: ${ASR_STREAM_SILENCE_FALLBACK_MS:500}

agent:
  pipeline: ${AGENT_PIPELINE_PATH:../agents/pipeline.yml}
