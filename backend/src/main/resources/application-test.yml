spring:
  datasource:
    url: jdbc:h2:mem:local_life_agent;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379

app:
  mock-session-store: true
  allow-mock-poi: true

external:
  amap:
    enabled: false
    web-service-key:
  search:
    enabled: false
    tavily-api-key:
  llm:
    enabled: false
    api-key:
    router-mode: primary-fallback
    secondary:
      enabled: true
      api-key:
