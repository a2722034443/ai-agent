external:
  amap:
    enabled: true
    base-url: https://restapi.amap.com
    web-service-key: ${AMAP_WEB_SERVICE_KEY:replace-with-amap-web-service-key}
    js-api-key: ${AMAP_JS_API_KEY:replace-only-when-frontend-map-is-needed}
    js-security-code: ${AMAP_JS_SECURITY_CODE:replace-only-when-frontend-map-is-needed}
    city:
    default-origin:
    timeout-ms: 3000
  search:
    enabled: true
    provider: tavily
    base-url: https://api.tavily.com
    tavily-api-key: ${TAVILY_API_KEY:replace-with-tavily-api-key}
    max-results: 5
    timeout-ms: 3000
  llm:
    enabled: true
    provider: mimo
    api-key: ${MIMO_API_KEY:replace-with-mimo-api-key}
    base-url: ${MIMO_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
    model: ${MIMO_MODEL:mimo-v2.5-pro}
    max-tokens: ${MIMO_MAX_TOKENS:1024}
    temperature: ${MIMO_TEMPERATURE:0.1}
    timeout-ms: ${MIMO_TIMEOUT_MS:3000}
    router-mode: ${MIMO_ROUTER_MODE:primary-fallback}
    secondary:
      enabled: ${MIMO_SECONDARY_ENABLED:true}
      api-key: ${MIMO_SECONDARY_API_KEY:replace-with-secondary-mimo-api-key}
      base-url: ${MIMO_SECONDARY_BASE_URL:}
      model: ${MIMO_SECONDARY_MODEL:}
      max-tokens: ${MIMO_SECONDARY_MAX_TOKENS:1024}
      timeout-ms: ${MIMO_SECONDARY_TIMEOUT_MS:4000}

app:
  mock-session-store: false
